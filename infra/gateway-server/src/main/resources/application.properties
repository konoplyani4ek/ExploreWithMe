spring.application.name=gateway-server
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server
spring.config.import=optional:configserver:

# ????????????? ???? ???????? ?? main-service ????? Eureka
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.routes[0].id=main-service
spring.cloud.gateway.routes[0].uri=lb://ewm-main-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/**

eureka.client.registry-fetch-interval-seconds=5

spring.cloud.gateway.routes[0].filters[0].name=Retry
spring.cloud.gateway.routes[0].filters[0].args.retries=5
spring.cloud.gateway.routes[0].filters[0].args.statuses=SERVICE_UNAVAILABLE
spring.cloud.gateway.routes[0].filters[0].args.methods=GET,POST,PUT,PATCH,DELETE
spring.cloud.gateway.routes[0].filters[0].args.backoff.firstBackoff=200ms
spring.cloud.gateway.routes[0].filters[0].args.backoff.maxBackoff=2000ms
spring.cloud.gateway.routes[0].filters[0].args.backoff.factor=2